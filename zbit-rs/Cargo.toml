[package]
name = "zbit-rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "zbit_rs"
path = "src/lib.rs"

[[bin]]
name = "zbit-rs"
path = "src/main.rs"

[[bin]]
name = "zbit-benchmark"
path = "src/bin/benchmark_real_file.rs"

[[bin]]
name = "zbit-benchmark-stream"
path = "src/bin/benchmark_stream_real_file.rs"

# Dependencies carry the codec hot loops (xz2, zstd, brotli, flate2, preflate-rs), so they
# are optimized even in dev/test builds; the workspace crate stays at a low opt level for
# fast incremental compiles. Benchmarks always run --release (see zbit-rs/scripts/).
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[dependencies]
brotli = "8"
flate2 = "1.1"
zstd = "0.13"
crc32fast = "1.5"
preflate-rs = { path = "../vendor/preflate-rs" }
xz2 = "0.1"
rayon = "1.10"
blake3 = "1.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
